name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read pubspec version
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '[:space:]')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK for this version
        run: cp build/app/outputs/flutter-apk/app-release.apk "trainerone-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.version.outputs.version }}
          path: trainerone-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "trainerone-${{ steps.version.outputs.version }}.apk" \
            --repo "${{ github.repository }}" \
            --target main \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Debug-signed TrainerOne APK ${{ steps.version.outputs.version }} from pubspec.yaml. Sideload for testing."
